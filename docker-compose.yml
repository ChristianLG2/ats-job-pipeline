
name: ats-job-pipeline

services:
  db:
    image: postgres:16
    environment: 
      POSTGRES_USER: ${POSTGRES_USER} 
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    
    volumes:
      - pgdata:/var/lib/postgresql/data
    
    ports:
      - "5432:5432"
  app:
    build: .
    depends_on:
      - db
    env_file:
      - .env

volumes:
  pgdata: